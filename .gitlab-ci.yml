include:
  - project: "ci/core-cicd"
    ref: main
    file: "luminet.gitlab-ci.yml"

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_STRATEGY: clone
  COCOS_VERSION: "3.8.0"
  COCOS_PROJECT_DIR: src
  INTEGRATION_IMAGE: pentagon/l1_spaceflight_client
  INTEGRATION_WS_PATH: spaceflight

.build_cocos_creator_script: &build_cocos_creator_script
  stage: test
  script:
    - echo "====== Build Cocos Web Mobile ======"
    - |
      if [[ -d "./$COCOS_PROJECT_DIR/build/web-mobile" ]]; then
        echo "Using cache with key $CI_COMMIT_SHA"
        exit 0
      fi
    - node --version
    - npm install --prefix ./game-client-base
    - npm run build --prefix ./game-client-base
    - npm run install-dependencies --prefix "./$COCOS_PROJECT_DIR"
    - set +e
    - /Applications/CocosCreator/Creator/$COCOS_VERSION/CocosCreator.app/Contents/MacOS/CocosCreator --project "./$COCOS_PROJECT_DIR" --build "platform=web-mobile;debug=false;webOrientation=landscape;md5Cache=true;replaceSplashScreen=true"
    - set -e
    - |
      if [ -z "$(ls -A ./$COCOS_PROJECT_DIR/build/web-mobile)" ]; then
        echo -e "\033[0;31mFolder build is empty, please check the build scritp"
        exit 1
      fi
  tags:
    - cocos-new
  artifacts:
    when: always
    paths:
      - $COCOS_PROJECT_DIR/build/web-mobile
    expire_in: 1 day
  cache:
    - key:
        files:
          - $COCOS_PROJECT_DIR/package.json
          - $COCOS_PROJECT_DIR/package-lock.json
      paths:
        - $COCOS_PROJECT_DIR/node_modules
    - key: $CI_COMMIT_SHORT_SHA
      paths:
        - $COCOS_PROJECT_DIR/build/web-mobile
.base_build_cocos:
  <<: *build_cocos_creator_script

unit_test_js:
  stage: test
  image: "$NODEJS_IMAGE"
  tags:
    - docker
  before_script:
    - npm set registry http://npm.lumigame.com
    - cd ./game-client-base
    - npm install
    - npm run build
    - cd ..
    - cd ./src
    - npm run install-dependencies
  script:
    - npm run test-coverage
  allow_failure: false
  artifacts:
    when: always
    paths:
      - "./coverage"
      - "./reports"
    expire_in: 1 day
  cache:
    - key:
        files:
          - $COCOS_PROJECT_DIR/package.json
          - $COCOS_PROJECT_DIR/package-lock.json
      paths:
        - $COCOS_PROJECT_DIR/node_modules
  rules:
    - - if: "$CI_COMMIT_TAG =~ /^deploy-/"
        when: never
      - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
        when: never
    - if: $ENABLE_TEST_JS != "true"
      when: never
    - - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      - if: "$CI_COMMIT_BRANCH"

cocos_integration_tests:
  stage: test
  allow_failure: true
  before_script:
    - cd $COCOS_PROJECT_DIR
    - SERVICE_IMAGE="hub.lumigame.com/pentagon/game-clients/stub-service:LOCAL-latest"
    - CLIENT_IMAGE="hub.lumigame.com/${INTEGRATION_IMAGE}:$CI_COMMIT_SHORT_SHA"
    - docker login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $DOCKER_REG_LOCAL_URL;
    - docker pull $SERVICE_IMAGE
    - docker pull $CLIENT_IMAGE
    - docker rm -f -v client-$CI_COMMIT_SHORT_SHA service-$CI_COMMIT_SHORT_SHA
    - |
      CLIENT_PORT=$(expr $CI_JOB_ID % 64551 + 1024)
      cat << END > c.js
      window.envConfig = {
        isDev: false,
        systemType: "SC1",
        ssl: false,
        serverDomainMapper: {
          localhost: "localhost:$(expr $CLIENT_PORT + 1)",
        },
        subDomain: "",
        env: "LOCAL",
        subGuideDomain: "l1-guide",
        enableMsgpackParserAllGames: false,
        enableMsgpackParserOnNotification: false,
        userServiceUrlDev: "http://localhost:$(expr $CLIENT_PORT + 1)/",
        proxyRoute: "",
        websocket: {
          proxyPath: "${INTEGRATION_WS_PATH}",
          route: "",
        },
      };
      END

      export CLIENT_URL="http://localhost:$CLIENT_PORT/?token=x&lang=vi-VN"
      cat c.js
    - docker run -d -p "$CLIENT_PORT:80" -v $(pwd):/usr/share/nginx/html/c --name client-$CI_COMMIT_SHORT_SHA  $CLIENT_IMAGE
    - docker run -d -p "$(expr $CLIENT_PORT + 1):8080" -v "$(pwd)/tests/integration-tests/data:/builds/tests/integration-tests" --env NAMESPACES="/,/user/${INTEGRATION_WS_PATH}" --name service-$CI_COMMIT_SHORT_SHA $SERVICE_IMAGE
  script:
    - npm install
    - npm run test:integration
  after_script:
    - docker rm -f -v client-$CI_COMMIT_SHORT_SHA service-$CI_COMMIT_SHORT_SHA
    - docker rmi "hub.lumigame.com/${INTEGRATION_IMAGE}:$CI_COMMIT_SHORT_SHA"
  tags:
    - gpu-device
  rules:
    - - if: "$CI_COMMIT_TAG =~ /^deploy-/"
        when: never
      - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
        when: never
    - if: $ENABLE_TEST_JS != "true"
      when: never
    - - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      - if: "$CI_COMMIT_BRANCH"
  needs:
    - cocos_integration_docker_build
  cache:
    - key:
        files:
          - $COCOS_PROJECT_DIR/package.json
          - $COCOS_PROJECT_DIR/package-lock.json
      paths:
        - $COCOS_PROJECT_DIR/node_modules

  artifacts:
    paths:
      - ./test-results
    expire_in: 1 day
  retry: 1

cocos_integration_build:
  stage: test
  allow_failure: true
  before_script: []
  script:
    - cd game-client-base
    - npm install
    - npm run build
    - cd ..
    - cd $COCOS_PROJECT_DIR
    - npm install
    - CocosCreator --project . --build "platform=web-mobile;debug=false;webOrientation=landscape;md5Cache=true;replaceSplashScreen=true"
  tags:
    - cocos-3x, build-integration-test
  artifacts:
    when: always
    paths:
      - $COCOS_PROJECT_DIR/build/web-mobile
    expire_in: 1 day
  rules:
    - if: "$CI_COMMIT_TAG =~ /^deploy-/"
      when: never
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: $ENABLE_TEST_JS != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH"
  cache:
    - key:
        files:
          - $COCOS_PROJECT_DIR/package.json
          - $COCOS_PROJECT_DIR/package-lock.json
      paths:
        - $COCOS_PROJECT_DIR/node_modules

cocos_integration_docker_build:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - docker
  stage: test
  allow_failure: true
  before_script:
    - export CI_REGISTRY_IMAGE=$DOCKER_REG_LOCAL_URL/$INTEGRATION_IMAGE:$CI_COMMIT_SHORT_SHA
    - echo $CI_REGISTRY_IMAGE
    - |
      kaniko_config_file=/kaniko/.docker/config.json
      if [[ ! -f "$kaniko_config_file" ]]; then
      echo "No $kaniko_config_file found! Creating one now."
      cat << END_CONFIGS >> $kaniko_config_file
      {
        "auths" : {
          "${DOCKER_REG_LOCAL_URL}": {
            "auth": "$(printf "%s:%s" "${DOCKER_REG_LOCAL_USERNAME}" "${DOCKER_REG_LOCAL_PASSWORD}" | base64 | tr -d '\n')"
          }
        }
      }
      END_CONFIGS
      fi
  script:
    - /kaniko/executor
      --context .
      --dockerfile integration.dockerfile
      --destination "$CI_REGISTRY_IMAGE"
  after_script:
    - |
      kaniko_config_file=/kaniko/.docker/config.json
      rm $kaniko_config_file
  needs:
    - cocos_integration_build
  rules:
    - if: "$CI_COMMIT_TAG =~ /^deploy-/"
      when: never
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: $ENABLE_TEST_JS != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: "$CI_COMMIT_BRANCH"

.sonar_js:
  before_script:
    - - echo "===========Start Sonar Scanner============="
    - echo $SRC_PATH
    - echo $TEST_PATH
    - cp ./src/tsconfig.sonar.json ./src/tsconfig.json
